name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods
        run: npx pod-install ios

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/AERON.xcworkspace \
            -scheme AERON \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/AERON.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ../../AERON-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AERON-unsigned-IPA
          path: AERON-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
